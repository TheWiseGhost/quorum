# Three-node cluster. Try:  docker compose up -d && docker compose exec n1 quorum --servers n1:8000,n2:8000,n3:8000 put hello world
# Kill the leader:          docker compose exec n1 quorum --servers n1:8000,n2:8000,n3:8000 status   (find "LEADER")
#                           docker compose kill <leader>   (the others elect a new leader within ~1s)
x-node: &node
  build: .
  restart: "no"

services:
  n1:
    <<: *node
    command: ["--id", "1", "--peers", "1=n1:7000,2=n2:7000,3=n3:7000", "--client", "0.0.0.0:8000",
              "--metrics", "9000", "--data", "/data"]
    ports: ["8001:8000", "9001:9000"]
    volumes: ["n1:/data"]
  n2:
    <<: *node
    command: ["--id", "2", "--peers", "1=n1:7000,2=n2:7000,3=n3:7000", "--client", "0.0.0.0:8000",
              "--metrics", "9000", "--data", "/data"]
    ports: ["8002:8000", "9002:9000"]
    volumes: ["n2:/data"]
  n3:
    <<: *node
    command: ["--id", "3", "--peers", "1=n1:7000,2=n2:7000,3=n3:7000", "--client", "0.0.0.0:8000",
              "--metrics", "9000", "--data", "/data"]
    ports: ["8003:8000", "9003:9000"]
    volumes: ["n3:/data"]

volumes:
  n1:
  n2:
  n3:
